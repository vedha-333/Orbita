<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="orbitStrokeWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean Pure White Base Container with Subtle Border -->
  <rect x="6" y="6" width="116" height="116" rx="34" fill="#FFFFFF" stroke="rgba(0,0,0,0.06)" stroke-width="2" filter="url(#softShadow)"/>

  <!-- Outer Orbiting Ring in Vibrant Cyan & Violet -->
  <ellipse cx="64" cy="64" rx="42" ry="24" fill="none" stroke="url(#orbitStrokeWhite)" stroke-width="4.5" transform="rotate(-26 64 64)" stroke-dasharray="140 22" stroke-linecap="round" />

  <!-- Orbiting Node 1 (Cyan) -->
  <circle cx="28" cy="50" r="6.5" fill="#0EA5E9" />
  <!-- Orbiting Node 2 (Violet) -->
  <circle cx="98" cy="76" r="6.5" fill="#A855F7" />

  <!-- Central Core in Electric Blue -->
  <circle cx="64" cy="64" r="16" fill="#3B82F6" />
  <!-- Inner White Highlight Ring -->
  <circle cx="64" cy="64" r="7" fill="#FFFFFF" opacity="0.9" />
</svg>
