[package]
name = "task_browser_core"
version = "0.1.0"
edition = "2021"
description = "High-performance Rust WebAssembly core for My Task Browser extension"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
web-sys = { version = "0.3", features = [
  "console",
  "Window",
  "Storage",
  "Document"
] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s" # Optimize for small binary size in WebAssembly
lto = true
codegen-units = 1
